<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrustNote — Live session</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
    body { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
    .muted { color: #64748b; font-size: .9rem; }
    .banner { background: #ecfdf5; border: 1px solid #99f6e4; padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .banner.warn { background: #fffbeb; border-color: #fcd34d; }
    section { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    h2 { font-size: 1rem; margin: 0 0 .75rem; }
    pre { white-space: pre-wrap; font-size: .85rem; line-height: 1.45; }
    .claim { border-bottom: 1px solid #f1f5f9; padding: .5rem 0; }
    .tag { display: inline-block; font-size: .75rem; font-weight: 600; padding: .15rem .45rem; border-radius: 4px; margin-right: .5rem; }
    .Supported { background: #ccfbf1; color: #0f766e; }
    .Contradicted { background: #fee2e2; color: #b91c1c; }
    .Unverifiable { background: #ffedd5; color: #c2410c; }
  </style>
</head>
<body>
  <h1>TrustNote live session</h1>
  <p class="muted">Fallback viewer (Next.js UI unavailable). Data refreshes every 3s.</p>
  <div id="status" class="banner warn">Waiting for pipeline…</div>
  <section><h2>SOAP note</h2><pre id="soap">—</pre></section>
  <section><h2>Claims</h2><div id="claims"></div></section>
  <script>
    const API = 'http://127.0.0.1:8765/live-session.json'
    function soapText(note) {
      if (!note) return '—'
      const keys = ['subjective','objective','assessment','plan']
      return keys.map(k => {
        const t = (note[k] || '').trim()
        if (!t) return ''
        return k.charAt(0).toUpperCase() + k.slice(1) + ':\n' + t
      }).filter(Boolean).join('\n\n') || '—'
    }
    async function refresh() {
      try {
        const res = await fetch(API + '?t=' + Date.now())
        const data = await res.json()
        const st = document.getElementById('status')
        if (data.status !== 'ready' || !data.session) {
          st.className = 'banner warn'
          st.textContent = data.message || 'Paste conversation in terminal and type END.'
          return
        }
        st.className = 'banner'
        const s = data.session
        st.textContent = s.patient.name + ' · ' + s.session.doctorName + ' · ' + s.session.totalClaims + ' claims · ' + s.session.unsupportedPercentage + '% unsupported'
        document.getElementById('soap').textContent = soapText(s.soapNote?.original) || s.formattedNote || '—'
        const box = document.getElementById('claims')
        box.innerHTML = (s.claims || []).map(c =>
          '<div class="claim"><span class="tag ' + c.label + '">' + c.label + '</span>' + c.text + '</div>'
        ).join('') || '<p class="muted">No claims yet.</p>'
      } catch (e) {
        document.getElementById('status').textContent = 'Cannot reach API at ' + API + ' — is main.py running?'
      }
    }
    refresh()
    setInterval(refresh, 3000)
  </script>
</body>
</html>
