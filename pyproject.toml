[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "trustnote"
version = "0.1.0"
description = "Transcript-grounded clinical note research pipeline"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]
[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.44,<5", "sentence-transformers>=3,<6", "sentencepiece>=0.2", "protobuf>=4"]
metrics = ["rouge-score>=0.1.2", "bert-score>=0.3.13"]
[project.scripts]
trustnote = "trustnote.cli:main"
[tool.setuptools.packages.find]
include = ["trustnote*"]
